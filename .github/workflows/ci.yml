name: CI

on:
  push:
    branches:
      - main
      - ia
  pull_request:
    branches:
      - main
      - ia

permissions:
  contents: read

jobs:
  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Backend - Build, Testes e Cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, testes e JaCoCo
        run: ./mvnw clean verify -Dspring.profiles.active=test

      - name: Verificar relatório JaCoCo
        run: |
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "ERRO: relatório JaCoCo não encontrado."
            exit 1
          fi
          echo "Relatório JaCoCo encontrado:"
          ls -lh target/site/jacoco/jacoco.xml

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    name: Frontend - Build, Testes e Cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes e cobertura
        run: npm run test:coverage

      - name: Preparar relatório LCOV para SonarCloud
        run: |
          LCOV_FILE=$(find coverage -type f -name "lcov.info" | head -n 1)

          if [ -z "$LCOV_FILE" ]; then
            echo "ERRO: arquivo lcov.info não encontrado."
            exit 1
          fi

          mkdir -p coverage/sonar
          cp "$LCOV_FILE" coverage/sonar/lcov.info
          ls -lh coverage/sonar/lcov.info

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Front/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build

  # ============================================================
  # SONARCLOUD - BACKEND E FRONTEND
  # ============================================================

  sonarcloud-backend:
    name: SonarCloud - Backend Scan
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Baixar cobertura do backend
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

      - name: Compilar classes Java
        working-directory: backend
        run: ./mvnw compile test-compile

      - name: Executar Sonar Backend
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.organization="sgac-gestaoatividadecomplementarorg" \
            -Dsonar.projectKey="sgac-gestaoatividadecomplementarorg-backend" \
            -Dsonar.host.url="https://sonarcloud.io" \
            -Dsonar.java.binaries="target/classes" \
            -Dsonar.java.test.binaries="target/test-classes" \
            -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml"

  sonarcloud-frontend:
    name: SonarCloud - Frontend Scan
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar cobertura do frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Front/coverage/

      - name: Executar Sonar Frontend
        uses: sonarsource/sonarcloud-github-action@v3
        with:
          projectBaseDir: Front
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
