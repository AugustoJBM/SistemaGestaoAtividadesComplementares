name: CI

on:
  push:
    branches:
      - main
      - ia
  pull_request:
    branches:
      - main
      - ia

permissions:
  contents: read

jobs:

  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Backend - Build, Testes e Cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes e JaCoCo
        run: ./mvnw clean verify -Dspring.profiles.active=test

      - name: Verificar relatório JaCoCo
        run: |
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "ERRO: relatório JaCoCo não encontrado."
            exit 1
          fi

          echo "Relatório JaCoCo encontrado:"
          ls -lh target/site/jacoco/jacoco.xml

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14


  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    name: Frontend - Build, Testes e Cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes e cobertura
        run: npm run test:coverage

      - name: Preparar relatório LCOV para SonarCloud
        run: |
          LCOV_FILE=$(find coverage -type f -name "lcov.info" | head -n 1)

          if [ -z "$LCOV_FILE" ]; then
            echo "ERRO: arquivo lcov.info não encontrado."
            exit 1
          fi

          echo "LCOV encontrado em:"
          echo "$LCOV_FILE"

          mkdir -p coverage/sonar
          cp "$LCOV_FILE" coverage/sonar/lcov.info

          echo ""
          echo "LCOV preparado para o SonarCloud:"
          ls -lh coverage/sonar/lcov.info

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Front/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build


  # ============================================================
  # SONARCLOUD
  # ============================================================

  sonarcloud:
    name: SonarCloud - Análise
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Baixar cobertura do backend
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

      - name: Baixar cobertura do frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Front/coverage/

      - name: Verificar arquivos de cobertura
        run: |
          echo "========================================"
          echo "        COBERTURA DO BACKEND"
          echo "========================================"

          if [ ! -f backend/target/site/jacoco/jacoco.xml ]; then
            echo "ERRO: jacoco.xml não encontrado."
            exit 1
          fi

          ls -lh backend/target/site/jacoco/jacoco.xml

          echo ""
          echo "========================================"
          echo "        COBERTURA DO FRONTEND"
          echo "========================================"

          if [ ! -f Front/coverage/sonar/lcov.info ]; then
            echo "ERRO: lcov.info não encontrado."
            exit 1
          fi

          ls -lh Front/coverage/sonar/lcov.info

      - name: SonarCloud Scan
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.organization="sgac-gestaoatividadecomplementarorg" \
            -Dsonar.projectKey="sgac-gestaoatividadecomplementarorg_gestaoatividadecomplementarorg" \
            -Dsonar.host.url="https://sonarcloud.io" \
            -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml" \
            -Dsonar.javascript.lcov.reportPaths="../Front/coverage/sonar/lcov.info"