name: Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy no Render
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Verificar Deploy Hook Backend
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERRO: RENDER_DEPLOY_HOOK_BACKEND não está configurado."
            exit 1
          fi

      - name: Trigger Render Deploy Backend
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          curl --fail --show-error --silent \
            -X POST "$RENDER_DEPLOY_HOOK"

      - name: Verificar Deploy Hook Frontend
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERRO: RENDER_DEPLOY_HOOK_FRONTEND não está configurado."
            exit 1
          fi

      - name: Trigger Render Deploy Frontend
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          curl --fail --show-error --silent \
            -X POST "$RENDER_DEPLOY_HOOK"
