spring.application.name=backend
spring.profiles.active=dev

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Autenticação e JWT
jwt.secret=${JWT_SECRET:c2VjdXJlLXNlY3JldC1rZXktZm9yLWp3dC1zZWN1cml0eQ==}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Cargas horárias exigidas (UFAPE)
sgac.progresso.acc.horas-exigidas=90
sgac.progresso.acex.horas-exigidas=320

# Upload de arquivos (Multipart)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
sgac.certificados.diretorio=${CERTIFICADOS_DIR:certificados}

# APIs de Inteligência Artificial
groq.api.key=${GROQ_API_KEY:}
huggingface.api.key=${HUGGINGFACE_API_KEY:}