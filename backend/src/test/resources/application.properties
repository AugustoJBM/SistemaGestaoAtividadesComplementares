spring.application.name=backend-test

# Banco de dados em memória isolado para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Chave JWT estática para o contexto de testes
jwt.secret=7hlh3JJwQOSoWiU8L5XwEDxE2PfkafFBgyr7lQaEb78=
jwt.expiration-ms=3600000

# CORS permitido para testes
app.cors.allowed-origins=http://localhost:4200

# Cargas horárias exigidas
sgac.progresso.acc.horas-exigidas=90
sgac.progresso.acex.horas-exigidas=320

# Mock de chaves de IA (evita falha na injeção de dependências)
groq.api.key=dummy-key
huggingface.api.key=dummy-key